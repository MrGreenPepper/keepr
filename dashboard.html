<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>keepr</title>
<style>
:root {
  --pop-bg: #ffffff; --pop-border: #cdc9c1; --scrim: rgba(25,24,20,.16); --pop-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 10px rgba(0,0,0,.07), 0 20px 48px rgba(0,0,0,.20);
  --plant-l: 30%; --bg: #f6f6f4; --panel: #ffffff; --panel-2: #f0efec; --line: #e2e0db; --text: #1f1f1d; --muted: #6d6b66;
  --accent: #5b5bd6; --accent-soft: #ececfb; --ok: #2f8f5b; --warn: #c27a12; --bad: #c4423c; --info: #2f6fb7;
  --sp: 1.25; /* spacing scale, set from the settings menu */
  --timer-font: ui-rounded, "SF Pro Rounded", Nunito, "Varela Round", Quicksand, Cantarell, "Fira Sans", system-ui, sans-serif;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pop-bg: #2c2c29; --pop-border: #4b4a45; --scrim: rgba(0,0,0,.42); --pop-shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.35), 0 22px 56px rgba(0,0,0,.55); --plant-l: 40%; --bg: #161615; --panel: #1f1f1d; --panel-2: #272725; --line: #34332f; --text: #ecebe7; --muted: #9a9890;
    --accent: #8b8bf0; --accent-soft: #2b2b45; --ok: #5cc38b; --warn: #e3a64a; --bad: #ec746d; --info: #6ea8ea;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pop-bg: #2c2c29; --pop-border: #4b4a45; --scrim: rgba(0,0,0,.42); --pop-shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.35), 0 22px 56px rgba(0,0,0,.55); --plant-l: 40%; --bg: #161615; --panel: #1f1f1d; --panel-2: #272725; --line: #34332f; --text: #ecebe7; --muted: #9a9890;
  --accent: #8b8bf0; --accent-soft: #2b2b45; --ok: #5cc38b; --warn: #e3a64a; --bad: #ec746d; --info: #6ea8ea;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }

/* layout */
.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.brand .dot.live { background: var(--ok); }
button.brand { border: 0; background: none; color: inherit; font: inherit; font-weight: 700; padding: 4px 6px; margin: -4px -6px; border-radius: 6px; cursor: pointer; }
button.brand:hover, button.brand[aria-expanded="true"] { background: var(--panel-2); }
.settings-pop { position: fixed; top: 52px; left: 16px; width: min(980px, calc(100vw - 32px)); height: min(720px, calc(100vh - 72px)); background: var(--pop-bg); border: 1px solid var(--pop-border); border-radius: 16px; box-shadow: var(--pop-shadow); z-index: 15; display: grid; grid-template-columns: 220px minmax(0, 1fr); overflow: hidden; }
.settings-pop[hidden] { display: none; }
/* Popovers (settings, pomodoro): elevated surface, dimmed page behind, pointer to the trigger */
.settings-pop:not([hidden]), .pomo-pop:not([hidden]) { animation: pop-in .14s ease-out; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.pop-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 14; opacity: 0; pointer-events: none; transition: opacity .15s ease; }
.pop-scrim.on { opacity: 1; pointer-events: auto; }
.pop-caret { position: fixed; width: 12px; height: 12px; background: var(--pop-bg); border: 1px solid var(--pop-border); border-right: 0; border-bottom: 0; transform: rotate(45deg); z-index: 16; pointer-events: none; }
.pop-caret[hidden] { display: none; }
.settings-pop input, .settings-pop .input, .pomo-pop .input, .pomo-pop .seg button { background: var(--panel-2); }
@media (prefers-reduced-motion: reduce) { .settings-pop, .pomo-pop { animation: none !important; } }
.settings-pop * { min-width: 0; overflow-wrap: anywhere; }
.settings-pop .set-nav { display: flex; flex-direction: column; gap: 4px; padding: calc(24px * var(--sp)) calc(14px * var(--sp)); background: var(--panel-2); border-right: 1px solid var(--line); overflow-y: auto; }
.settings-pop .set-nav h3 { margin: 0 10px calc(14px * var(--sp)); font-size: 18px; font-weight: 650; }
.settings-pop .set-nav button { text-align: left; border: 0; background: transparent; color: var(--text); font-size: 15px; padding: calc(9px * var(--sp)) 12px; border-radius: 9px; }
.settings-pop .set-nav button:hover { background: var(--pop-bg); }
.settings-pop .set-nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; box-shadow: inset 3px 0 var(--accent); }
.settings-pop .set-main { overflow-y: auto; padding: calc(28px * var(--sp)) calc(34px * var(--sp)); display: grid; align-content: start; gap: calc(16px * var(--sp)); }
.settings-pop .set-head { padding-bottom: calc(14px * var(--sp)); border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.settings-pop .set-head h2 { margin: 0; font-size: 22px; font-weight: 650; color: var(--text); }
.settings-pop .set-head p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.settings-pop .set-note { margin: 0; font-size: 13px; color: var(--muted); }
.settings-pop .set-vrow { display: grid; gap: 6px; }
.settings-pop .set-mode { justify-self: start; margin-left: 108px; border-radius: 8px; }
.settings-pop .set-mode button { padding: 3px 12px; font-size: 12.5px; }
.settings-pop .set-row.dim input[type="range"] { opacity: .4; }
.settings-pop .set-spread { font-size: 13px; color: var(--muted); }
.settings-pop .set-spread > span:first-child { padding-left: 12px; }
@media (max-width: 520px) { .settings-pop .set-mode { margin-left: 0; } }
.settings-pop .set-sub { margin: calc(10px * var(--sp)) 0 0; font-size: 16px; font-weight: 650; color: var(--text); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.settings-pop .set-sub:first-of-type { margin-top: 0; }
.settings-pop .set-sub small { font-size: 13px; font-weight: 400; color: var(--muted); }
.settings-pop .set-seg { justify-self: start; border-radius: 9px; }
.settings-pop .set-seg button { padding: calc(7px * var(--sp)) 16px; font-size: 14px; }
/* one feature per group: its switch on top, its own settings in a tinted panel below */
.settings-pop .set-grp { display: grid; gap: calc(12px * var(--sp)); padding: calc(14px * var(--sp)) calc(16px * var(--sp)); border: 1px solid var(--line); border-radius: 11px; }
.settings-pop .set-body { display: grid; gap: calc(12px * var(--sp)); padding: calc(12px * var(--sp)) calc(14px * var(--sp)); margin-left: 28px; background: var(--panel-2); border-radius: 9px; }
.settings-pop .opt { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; font-size: 15px; font-weight: 550; }
.settings-pop .set-body .opt { font-size: 14px; }
.settings-pop .opt > span { flex: 1; }
.settings-pop .opt input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: var(--accent); }
.settings-pop .opt small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
.settings-pop .set-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 92px; align-items: center; gap: 12px; font-size: 14px; }
.settings-pop .set-row input[type="range"] { width: 100%; accent-color: var(--accent); }
.settings-pop .set-row .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.settings-pop .set-num { display: flex; align-items: center; gap: 10px; grid-column: span 2; }
.settings-pop .set-num .input { width: 76px; padding: calc(6px * var(--sp)) 10px; font-size: 14px; border-radius: 8px; flex: none; background: var(--pop-bg); }
.settings-pop .set-num small { color: var(--muted); font-size: 13px; }
.settings-pop .off { opacity: .45; pointer-events: none; }
@media (max-width: 640px) { .settings-pop { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } .settings-pop .set-nav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px; } .settings-pop .set-nav h3 { width: 100%; margin-bottom: 4px; } }
@media (max-width: 520px) { .settings-pop .set-row { grid-template-columns: 1fr auto; } .settings-pop .set-row input[type="range"] { grid-column: 1 / -1; grid-row: 2; } .settings-pop .set-body { margin-left: 0; } }
.tabs { display: flex; gap: 2px; background: var(--panel-2); padding: 3px; border-radius: 8px; }
.tabs button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; color: var(--muted); }
.tabs button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.tabs .count { font-size: 11px; color: var(--muted); margin-left: 4px; }
.spacer { flex: 1; }
.search { width: 220px; max-width: 100%; }
main { overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

.input, select.input, textarea.input { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; outline: none; }
.input:focus { border-color: var(--accent); }
.btn { text-decoration: none; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 11px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--panel-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 2px 8px; font-size: 12px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.chip.tag { background: var(--accent-soft); color: var(--accent); }
.chip.link { cursor: pointer; }
.id { font: 600 11.5px ui-monospace, SFMono-Regular, monospace; color: var(--muted); }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 40px; text-align: center; }

/* status colors */
[data-s="todo"] { --s: var(--muted); } [data-s="in_progress"] { --s: var(--info); }
[data-s="review"] { --s: var(--warn); } [data-s="done"] { --s: var(--ok); }
[data-s="open"] { --s: var(--info); } [data-s="followup"] { --s: var(--warn); }
[data-s="clarified"] { --s: var(--ok); } [data-s="dropped"] { --s: var(--muted); }
.sdot { width: 9px; height: 9px; border-radius: 50%; background: var(--s); display: inline-block; flex: none; }
.prio { font-size: 12px; font-weight: 700; }
.prio.urgent { color: var(--bad); } .prio.high { color: var(--warn); } .prio.normal { color: var(--muted); } .prio.low { color: var(--muted); opacity: .6; }
.overdue { color: var(--bad); font-weight: 600; }

/* toolbar */
.toolbar { display: flex; gap: calc(8px * var(--sp)); align-items: center; padding: calc(10px * var(--sp)) 16px; flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 4px 10px; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* answers */
.split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; flex: 1; min-height: 0; border-top: 1px solid var(--line); }
.alist { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
.aitem { padding: calc(12px * var(--sp)) calc(16px * var(--sp)); border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: calc(5px * var(--sp)); }
.aitem:hover { background: var(--panel-2); }
.aitem.sel { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
.aitem .top { display: flex; gap: 8px; align-items: center; }
.aitem .title { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
/* list column: everything wraps inside it instead of pushing under the detail pane */
.aitem { grid-template-columns: minmax(0, 1fr); }
.aitem > *, .aitem .meta > * { min-width: 0; }
.aitem .top { align-items: flex-start; }
.aitem .top .sdot { margin-top: 6px; }
.aitem .top .id { flex: none; padding-top: 2px; }
.aitem .sum { overflow-wrap: anywhere; }
.aitem .chip { white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
.aitem .sum { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.aitem .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; }
.adetail { overflow: auto; padding: calc(24px * var(--sp)) calc(30px * var(--sp)) 60px; }
.adetail .head { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.title-edit { font-size: 20px; font-weight: 700; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 2px 6px; margin-left: -7px; flex: 1; min-width: 200px; }
.title-edit:hover, .title-edit:focus { border-color: var(--line); background: var(--panel); outline: none; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 18px; }
.section { margin-top: calc(22px * var(--sp)); }
.section > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: calc(14px * var(--sp)) calc(18px * var(--sp)); box-shadow: var(--shadow); }
.prompt { background: var(--panel-2); border-radius: var(--radius); padding: 10px 14px; white-space: pre-wrap; color: var(--muted); max-height: 160px; overflow: auto; }

/* checklist */
.check { display: flex; gap: 10px; align-items: flex-start; padding: calc(6px * var(--sp)) calc(6px * var(--sp)); border-radius: 6px; }
.check:hover { background: var(--panel-2); }
.check input[type=checkbox] { margin-top: 3px; accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
.check .txt { flex: 1; }
.check.done .txt { color: var(--muted); text-decoration: line-through; }
.check .acts { display: flex; gap: 4px; opacity: 0; }
.check:hover .acts { opacity: 1; }
.add-row { display: flex; gap: 6px; margin-top: 6px; }
.add-row .input { flex: 1; min-width: 0; }

/* markdown */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { margin: 1.1em 0 .4em; line-height: 1.3; }
.md h1 { font-size: 1.35em; } .md h2 { font-size: 1.2em; } .md h3 { font-size: 1.05em; }
.md code { font: 12.5px ui-monospace, SFMono-Regular, monospace; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--panel-2); padding: 12px; border-radius: 8px; overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--line); margin: 0; padding-left: 12px; color: var(--muted); }
.md table { border-collapse: collapse; margin: .6em 0; display: block; overflow: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
.md th { background: var(--panel-2); }
.md ul, .md ol { padding-left: 1.4em; }

/* tasks: board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: calc(12px * var(--sp)); padding: 4px 16px 16px; overflow: auto; flex: 1; min-height: 0; }
.col { background: var(--panel-2); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; }
.col-head { display: flex; align-items: center; gap: 8px; padding: calc(10px * var(--sp)) calc(12px * var(--sp)) calc(6px * var(--sp)); font-weight: 600; font-size: 13px; }
.col-head .n { color: var(--muted); font-weight: 500; }
.col-body { padding: calc(4px * var(--sp)) calc(8px * var(--sp)) calc(8px * var(--sp)); overflow: auto; flex: 1; display: flex; flex-direction: column; gap: calc(8px * var(--sp)); min-height: 60px; }
.col.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: calc(9px * var(--sp)) calc(11px * var(--sp)); cursor: pointer; display: grid; gap: calc(6px * var(--sp)); box-shadow: var(--shadow); }
.tcard:hover { border-color: var(--muted); }
.tcard.dragging { opacity: .4; }
.tcard .t { font-weight: 550; }
.tcard .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--ok); }
.quick { border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 6px; color: var(--muted); text-align: left; }
.quick:hover { color: var(--text); border-color: var(--muted); }

/* tasks: list */
.nextup { margin: 0 16px 10px; padding: calc(10px * var(--sp)) calc(12px * var(--sp)); display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 16px; }
.nextup > h3 { grid-column: 1 / -1; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
.nextup .ng-head { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
.nextup .ng-head.overdue { color: var(--bad); }
.nextup .nrow { display: flex; gap: 8px; align-items: baseline; padding: calc(3px * var(--sp)) 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.nextup .nrow:hover { background: var(--panel-2); }
.nextup .nrow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nextup .nrow .meta { display: flex; gap: 6px; align-items: baseline; font-size: 12px; color: var(--muted); white-space: nowrap; }
.tlist { overflow: auto; padding: 0 16px 24px; flex: 1; }
.group { margin-top: calc(14px * var(--sp)); }
.group-head { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 6px 2px; }
.trow { display: grid; grid-template-columns: 54px 1fr 130px 100px 110px 70px; align-items: center; gap: 10px; padding: calc(7px * var(--sp)) calc(10px * var(--sp)); background: var(--panel); border: 1px solid var(--line); border-top: 0; cursor: pointer; }
.trow:first-of-type { border-top: 1px solid var(--line); border-radius: 8px 8px 0 0; }
.trow:last-child { border-radius: 0 0 8px 8px; }
.trow:only-of-type { border-radius: 8px; }
.trow:hover { background: var(--panel-2); }
.trow .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow select { border: 0; background: transparent; padding: 0; }
.thead { display: grid; grid-template-columns: 54px 1fr 130px 100px 110px 70px; gap: 10px; padding: 4px 10px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; z-index: 10; }
.drawer-bg.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--bg); border-left: 1px solid var(--line); z-index: 11; transform: translateX(100%); transition: transform .18s ease; overflow: auto; padding: calc(18px * var(--sp)) calc(24px * var(--sp)) 60px; }
.drawer.open { transform: none; }
.props { display: grid; grid-template-columns: 110px 1fr; gap: calc(8px * var(--sp)) 12px; align-items: center; margin: 14px 0; }
.props label { color: var(--muted); font-size: 13px; }
textarea.desc { width: 100%; min-height: 120px; resize: vertical; }
.comment { padding: calc(8px * var(--sp)) calc(12px * var(--sp)); border-radius: 8px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 6px; }
.comment.ai { border-left: 3px solid var(--accent); }
.comment .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }

/* references (T5, A3, I2) */
a.ref { font: 600 12px ui-monospace, SFMono-Regular, monospace; text-decoration: none; background: var(--accent-soft); padding: 0 5px; border-radius: 4px; }
a.ref.done { text-decoration: line-through; opacity: .7; }
.editable { cursor: text; min-height: 40px; }
.editable:hover { border-color: var(--muted); }

/* subtasks */
.check .sub-st { font-size: 11px; }
.sub-desc { margin: -2px 0 4px 54px; font-size: 12.5px; color: var(--muted); }
.sub-desc .md p { margin: 0; }
.sub-edit { margin: 0 0 8px 29px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); display: grid; gap: 6px; }
.sub-edit .row { display: flex; gap: 6px; }

/* links */
.chip.blocked { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
#l-add select { flex: none; }

/* inbox */
.capture { display: flex; gap: 6px; flex: 1; max-width: 520px; }
.capture .input { flex: 1; }

/* pomodoro */
.pomo-btn { font-variant-numeric: tabular-nums; }
.pomo-btn.running[data-m="focus"] { color: var(--bad); border-color: var(--bad); }
.pomo-btn.running:not([data-m="focus"]) { color: var(--ok); border-color: var(--ok); }
.pomo-pop { position: fixed; top: 52px; right: 16px; width: min(600px, calc(100vw - 32px)); max-height: calc(100vh - 72px); overflow-y: auto; background: var(--pop-bg); border: 1px solid var(--pop-border); border-radius: 14px; box-shadow: var(--pop-shadow); padding: calc(28px * var(--sp)) calc(34px * var(--sp)); z-index: 15; display: grid; gap: calc(20px * var(--sp)); }
.pomo-pop[hidden] { display: none; }
.pomo-pop > * { min-width: 0; }
.pomo-pop .seg { border-radius: 10px; }
.pomo-pop .seg button { flex: 1; padding: calc(9px * var(--sp)) 10px; font-size: 14px; }
.pp-clock { display: grid; gap: 10px; justify-items: center; padding: calc(6px * var(--sp) + (var(--timer-scale, 1) - 1) * 40px) 0 calc(6px * var(--sp)); }
.pomo-time { font: 400 calc(76px * var(--timer-scale, 1))/1 var(--timer-font); text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.pomo-dots { text-align: center; color: var(--muted); font-size: 13px; letter-spacing: 2px; }
.pomo-pop .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(10px * var(--sp)); }
.pomo-pop .row .btn { justify-content: center; padding: calc(10px * var(--sp)) 14px; font-size: 15px; border-radius: 10px; gap: 8px; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.pp-sec { display: grid; gap: calc(10px * var(--sp)); padding-top: calc(16px * var(--sp)); border-top: 1px solid var(--line); }
.pp-sec h4 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.pomo-pop select { width: 100%; padding: calc(8px * var(--sp)) 10px; font-size: 14px; border-radius: 9px; }
.pomo-cfg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(12px * var(--sp)) 16px; font-size: 13px; }
.pomo-cfg label { display: grid; gap: 5px; color: var(--text); }
.pomo-cfg .pc-in { display: flex; align-items: center; gap: 8px; }
.pomo-cfg .pc-in small { color: var(--muted); font-size: 12px; }
.pomo-cfg .input { width: 72px; padding: calc(6px * var(--sp)) 10px; font-size: 14px; border-radius: 8px; flex: none; }
/* idle focus view: the running timer grows to the centre, shrinks back into the button on activity */
.pomo-veil { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; z-index: 40; transition: opacity .6s ease; }
.pomo-veil.on { opacity: 1; }

.pomo-big { position: fixed; left: 50%; top: 50%; z-index: 41; pointer-events: none; transform-origin: center;
  width: min(880px, calc(100vw - 48px)); padding: 24px 64px 32px; display: grid; gap: 0; justify-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.22);
  transition: transform .6s cubic-bezier(.2,.8,.2,1), opacity .6s ease; }

.pomo-big .pb-mode::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.pomo-big:not([data-m="focus"]) .pb-mode::before { background: var(--ok); }
.pomo-big .pb-time { font: 400 calc(clamp(88px, 22vw, 140px) * var(--timer-scale, 1))/1 var(--timer-font); font-variant-numeric: tabular-nums; color: var(--text); letter-spacing: .01em; }
/* ring mode: minutes inside a slowly draining circle (calmer than ticking seconds) */
.pomo-big .pb-ringed { position: relative; width: 1.75em; height: 1.75em; display: grid; place-content: center; justify-items: center; font-size: calc(clamp(88px, 22vw, 140px) * var(--timer-scale, 1) * .58); }
.pomo-big .pb-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }

.pomo-big .pb-bar { width: 100%; height: 6px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.pomo-big .pb-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width 1s linear; }
.pomo-big:not([data-m="focus"]) .pb-bar i { background: var(--ok); }

   above the middle (optical centre, ~42 %), progress and task below. The task line always keeps
   its space so the layout never shifts. */
.pomo-big .pb-time { margin-top: calc(15px + (var(--timer-scale, 1) - 1) * 100px); } /* tall script ascenders need more room */
.pomo-big .pb-bar { margin-top: 46px; }
.pomo-big .pb-task { margin-top: 12px; min-height: 1.45em; font-size: 17px; color: var(--muted); text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pomo-plant .leaf, .pomo-plant .bloom { transform-box: view-box; transform-origin: 0 0; transform: scale(0); transition: transform 1.4s cubic-bezier(.2,.8,.2,1); }

.pomo-plant .crack.on .hole { transform: scale(1); }
.pomo-plant g[hidden] { display: none; }
.pomo-plant .leaf { fill: var(--ok); opacity: .85; }
.pomo-plant .bloom circle { fill: var(--bloom, #f3b3c4); }
.pomo-plant .bloom circle.c { fill: var(--bloom-c, #f2cf6b); }

.pomo-ascii { position: absolute; inset: 0; width: 100%; height: 100%; }

.pomo-big.ascii { --timer-font: ui-monospace, SFMono-Regular, Menlo, monospace; --timer-scale: .9; }

.pomo-kitten svg { display: block; width: 100%; overflow: visible; }
.pomo-kitten .k-fur { fill: #e9a15b; } .pomo-kitten .k-dk { fill: #d48a45; }
.pomo-kitten .k-belly { fill: #f6dcb8; } .pomo-kitten .k-ear { fill: #f2a7b4; } .pomo-kitten .k-nose { fill: #e7849a; }
.pomo-kitten .k-stripe { fill: none; stroke: #c27434; stroke-width: 2.4; stroke-linecap: round; }
.pomo-kitten .k-tail { fill: none; stroke: #e9a15b; stroke-width: 9; stroke-linecap: round; transform-box: view-box; transform-origin: 44px 124px; animation: k-tail 2.6s ease-in-out infinite; }
.pomo-kitten .k-eyes ellipse { fill: #2b2a26; transform-box: fill-box; transform-origin: center; animation: k-blink 5s 2s infinite; }
.pomo-kitten .k-mouth, .pomo-kitten .k-wh { fill: none; stroke: #6b4a2e; stroke-width: 1.2; stroke-linecap: round; }
.pomo-kitten .k-wh { stroke: rgba(80,60,40,.55); }
.pomo-kitten .k-cat { animation: k-walk 3.2s cubic-bezier(.3,.7,.4,1) both; }
.pomo-kitten .k-hop { animation: k-hop .4s ease-in-out 8 both; }
.pomo-kitten .k-head { transform-box: view-box; transform-origin: 100px 100px; animation: k-look 1.2s 4.6s ease-in-out both; }
.pomo-kitten .k-paw { transform-box: view-box; transform-origin: 105px 114px; animation: k-bat 1.8s 8.2s ease-in-out infinite; }
.pomo-kitten .k-stem { fill: none; stroke: color-mix(in srgb, var(--ok) 70%, var(--text)); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; animation: k-grow 2.4s 3.4s ease-out both; }

@keyframes k-tail { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(14deg); } }

<script>
const LABEL = {
  todo: 'To do', in_progress: 'In progress', review: 'Review', done: 'Done',
  open: 'Open', followup: 'Follow-up', urgent: 'Urgent', high: 'High', normal: 'Normal', low: 'Low',
  clarified: 'Clarified', dropped: 'Dropped', relates: 'Related to', blocks: 'Blocks', blocked_by: 'Blocked by',
};
const PRIO_MARK = { urgent: '⚑ Urgent', high: '⚑ High', normal: '', low: '↓ Low' };

const ls = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('keepr.' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('keepr.' + k, JSON.stringify(v)); } catch {} },
};
// One-time move of the settings stored before the rename (wf.* → keepr.*).
try {
  for (const k of Object.keys(localStorage)) {
    if (!k.startsWith('wf.')) continue;
    if (localStorage.getItem('keepr.' + k.slice(3)) === null) localStorage.setItem('keepr.' + k.slice(3), localStorage.getItem(k));
    localStorage.removeItem(k);
  }
} catch {}

const state = {
  projects: [], project: null, data: null,
  tab: ls.get('tab', 'answers'), aFilter: ls.get('aFilter', 'active'), view: ls.get('view', 'board'),
  showDone: ls.get('showDone', true), sel: null, task: null, q: '',
  iFilter: ls.get('iFilter', 'open'), isel: null, openSub: null, editing: null,
  day: null, dsel: null, ddraft: null,
};

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ------------------------------------------------------------ markdown (small, good enough)
// Turns IDs of existing items (T5, A3, I2) into links. Only outside of tags and existing links.
function linkRefs(html) {
  const d = state.data;
  if (!d) return html;
  let inA = 0;
  return html.split(/(<[^>]+>)/).map(part => {
    if (part.startsWith('<')) { if (/^<a[\s>]/.test(part)) inA++; else if (part === '</a>') inA--; return part; }
    if (inA) return part;
    return part.replace(/\b([ATI])(\d+)\b/g, (m) => {
      const kind = m[0], list = kind === 'A' ? d.answers : kind === 'T' ? d.tasks : d.inbox;
      const x = list.find(y => y.id === m);
      if (!x) return m;
      const done = ['done', 'clarified', 'dropped'].includes(x.status);
      return `<a href="#" class="ref ${done ? 'done' : ''}" data-ref="${m}" title="${esc(x.title)}">${m}</a>`;
    });
  }).join('');
}
function inline(s, refs = false) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  s = esc(s)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => /^(https?:|vscode:|mailto:)/.test(u) ? `<a href="${u}" target="_blank" rel="noreferrer">${t}</a>` : `<span class="chip">${t}</span>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>');
  if (refs) s = linkRefs(s);
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
}
function md(src, refs = false) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  let html = '', i = 0;
  const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; html += `<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { const n = Math.min(m[1].length + 1, 4); html += `<h${n}>${inline(m[2], refs)}</h${n}>`; i++; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)) { html += '<hr>'; i++; continue; }
    if (l.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(l); i += 2;
      let rows = '';
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows += '<tr>' + cells(lines[i++]).map(c => `<td>${inline(c, refs)}</td>`).join('') + '</tr>';
      html += `<table><thead><tr>${head.map(c => `<th>${inline(c, refs)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`; continue;
    }
    if (/^>\s?/.test(l)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      html += `<blockquote>${md(buf.join('\n'), refs)}</blockquote>`; continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l);
      const items = [];
      while (i < lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const ln = lines[i++];
        if (/^\s*([-*+]|\d+[.)])\s+/.test(ln) && !/^\s{2,}/.test(ln)) items.push(ln.replace(/^\s*([-*+]|\d+[.)])\s+/, ''));
        else items[items.length - 1] += '\n' + ln.replace(/^\s{2,4}/, '');
      }
      const tag = ordered ? 'ol' : 'ul';
      html += `<${tag}>${items.map(it => {
        const [first, ...rest] = it.split('\n');
        const box = first.match(/^\[([ xX])\]\s+(.*)/);
        const head = box ? `<input type="checkbox" disabled ${box[1] !== ' ' ? 'checked' : ''}> ${inline(box[2], refs)}` : inline(first, refs);
        return `<li>${head}${rest.length ? md(rest.join('\n'), refs) : ''}</li>`;
      }).join('')}</${tag}>`; continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,6}\s|>|\s*([-*+]|\d+[.)])\s+)/.test(lines[i])
      && !(lines[i].includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1]))) buf.push(lines[i++]);
    html += `<p>${buf.map(x => inline(x, refs)).join('<br>')}</p>`;
  }
  return html;
}

// ------------------------------------------------------------ api
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error((await r.json()).error);
  return r.json();
}
async function op(name, args) { return opIn(state.project, name, args); }
async function opIn(project, name, args) {
  const r = await fetch(`/api/op?p=${encodeURIComponent(project)}`, {
    method: 'POST', headers: { 'content-type': 'application/json', 'x-keepr': '1' }, body: JSON.stringify({ op: name, args }),
  });
  const j = await r.json();
  if (!r.ok) { toast(j.error); throw new Error(j.error); }
  if (project === state.project) await load();
  return j.result;
}
async function load() {
  state.data = await api(`/api/data?p=${encodeURIComponent(state.project)}`);
  render();
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800);
}
async function copy(text, msg = 'Copied') {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(msg);
}

// ------------------------------------------------------------ helpers
// Local calendar date (not UTC), like localDate() in keepr.mjs.
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function fmtDue(due) {
  if (!due) return '';
  const cls = due < today() ? 'overdue' : '';
  const d = new Date(due + 'T00:00');
  return `<span class="${cls}">📅 ${d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' })}</span>`;
}
const matches = (obj, fields) => !state.q || fields.some(f => String(obj[f] ?? '').toLowerCase().includes(state.q));
// Links of a task in both directions, like taskLinks() in keepr.mjs.
function taskLinks(t) {
  const out = (t.links || []).map(l => ({ id: l.to, rel: l.type }));
  for (const x of state.data.tasks) for (const l of x.links || [])
    if (l.to === t.id) out.push({ id: x.id, rel: l.type === 'blocks' ? 'blocked_by' : 'relates' });
  return out;
}
const blockers = (t) => taskLinks(t).filter(l => l.rel === 'blocked_by')
  .map(l => state.data.tasks.find(x => x.id === l.id)).filter(x => x && x.status !== 'done');

// Markdown that turns into a textarea on click; saved on blur.
function editableMd(key, value, placeholder) {
  if (state.editing === key || !value)
    return `<textarea class="input desc" data-key="${key}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`;
  return `<div class="card md editable" data-edit="${key}" title="Click to edit">${md(value, true)}</div>`;
}
function bindEditable(root, save) {
  root.querySelectorAll('[data-edit]').forEach(el => el.onclick = (e) => {
    if (e.target.closest('a')) return;
    state.editing = el.dataset.edit; render();
    const ta = root.querySelector(`textarea[data-key="${el.dataset.edit}"]`) || document.querySelector(`textarea[data-key="${el.dataset.edit}"]`);
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  });
  root.querySelectorAll('textarea[data-key]').forEach(ta => {
    const orig = ta.value;
    ta.onblur = () => {
      state.editing = null;
      Promise.resolve(ta.value !== orig && save(ta.dataset.key, ta.value)).finally(() => render({ force: true }));
    };
  });
}

function vscodeLink(session, prompt) {
  const p = new URLSearchParams();
  if (session) p.set('session', session);
  if (prompt) p.set('prompt', prompt);
  return `vscode://anthropic.claude-code/open?${p.toString().replace(/\+/g, '%20')}`;
}

// ------------------------------------------------------------ render
function render({ force = false } = {}) {
  if (!state.data) return;
  const d = state.data;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  $('#c-answers').textContent = d.answers.filter(a => a.status !== 'done').length || '';
  $('#c-tasks').textContent = d.tasks.filter(t => t.status !== 'done').length || '';
  $('#c-inbox').textContent = d.inbox.filter(i => i.status === 'open').length || '';
  $('#c-day').textContent = (d.plan || []).filter(b => b.date === today() && !b.done && (b.title || b.taskId)).length || '';
  ls.set('tab', state.tab);
  // Don't overwrite a text field in the main area while typing.
  const ae = document.activeElement;
  const typing = $('#main').contains(ae) && (ae.matches('textarea') || !!ae.closest('.deditor'));
  if (!typing) {
    if (state.tab === 'answers') renderAnswers();
    else if (state.tab === 'inbox') renderInbox();
    else if (state.tab === 'day') renderDay();
    else renderTasks();
  }
  if (state.task) renderDrawer(force);
  pomoPaint(true);
}

      ${tasks.length ? `<span class="chip">${tasks.length} task${tasks.length === 1 ? "" : "s"}</span>` : ''}

}

    <div class="section"><h3>Open points <span class="muted" style="text-transform:none;letter-spacing:0">${a.points.filter(p => p.done).length}/${a.points.length}</span></h3>
      <div id="points">${a.points.map(p => {
        const t = tasks.find(x => x.answerPoint === p.id);
        return `<div class="check ${p.done ? 'done' : ''}" data-pid="${p.id}">
          <input type="checkbox" ${p.done ? 'checked' : ''}><span class="txt">${inline(p.text)}</span>
          ${t ? `<span class="chip link" data-task="${t.id}" data-s="${t.status}"><span class="sdot"></span>${t.id}</span>` : ''}

        </div>`;

function bindAnswerDetail(a) {
  if (matchMedia('(max-width: 760px)').matches) { $('#back').style.display = ''; $('#back').onclick = () => selectAnswer(null); }
  $('#a-title').onchange = (e) => op('answer.update', { id: a.id, patch: { title: e.target.value } });
  $('#a-status').onchange = (e) => op('answer.update', { id: a.id, patch: { status: e.target.value } });
  $('#a-notes').onchange = (e) => op('answer.update', { id: a.id, patch: { notes: e.target.value } });
  bindEditable($('.adetail'), (_, v) => op('answer.update', { id: a.id, patch: { origin: v } }));
  $('#copy-content').onclick = () => copy(a.content);
  $('#copy-ref').onclick = () => copy(`/ref ${a.id} `, `"/ref ${a.id}" copied, paste it into Claude`);
  if ($('#copy-resume')) $('#copy-resume').onclick = () => copy(`claude --resume ${a.session}`);
  $('#a-chat').onclick = () => {
    const url = prompt('Link to the chat (empty = remove):', a.chatUrl || '');
    if (url !== null) op('answer.update', { id: a.id, patch: { chatUrl: url.trim() || null } });
  };
  $('#a-del').onclick = () => { if (confirm(`Delete ${a.id}?`)) { state.sel = null; op('answer.delete', { id: a.id }); } };
  $('#a-task').onclick = async () => {
    const t = await op('task.add', { title: a.title, description: a.summary || '', origin: a.origin || '', answerId: a.id });
    openTask(t.id);
  };
  $('#p-add').onsubmit = (e) => { e.preventDefault(); const v = e.target[0].value.trim(); if (v) op('answer.point.add', { id: a.id, text: v }); };
  $('#points').onclick = async (e) => {
    const row = e.target.closest('[data-pid]'); if (!row) return;
    const point = Number(row.dataset.pid);
    if (e.target.matches('input[type=checkbox]')) return op('answer.point.update', { id: a.id, point, done: e.target.checked });
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'del') return op('answer.point.update', { id: a.id, point, remove: true });
    if (act === 'task') {
      const p = a.points.find(x => x.id === point);
      const t = await op('task.add', { title: p.text, answerId: a.id, answerPoint: point });
      toast(`${t.id} created`);
    }
  };
  document.querySelectorAll('.adetail [data-task]').forEach(el => el.onclick = (e) => { e.preventDefault(); openTask(el.dataset.task); });
}

function selectAnswer(id) {
  state.sel = id;
  history.replaceState(null, '', location.pathname + location.search + (id ? '#' + id : ''));
  render();
}

    .filter(i => f === 'all' || i.status === f)
    .filter(i => matches(i, ['id', 'title', 'origin', 'notes']) || i.tags.some(t => t.includes(state.q)));
  const sel = d.inbox.find(i => i.id === state.isel);
  const n = (s) => d.inbox.filter(i => i.status === s).length;

  $('#main').innerHTML = `
    <div class="toolbar">
      <div class="seg" id="ifilter">
        ${[['open', `Open (${n('open')})`], ['clarified', 'Clarified'], ['dropped', 'Dropped'], ['all', 'All']]
          .map(([k, l]) => `<button data-f="${k}" class="${f === k ? 'on' : ''}">${l}</button>`).join('')}
      </div>
      <form class="capture" id="capture"><input class="input" placeholder="What still needs clarifying? (Enter)"><button class="btn primary">＋ Inbox</button></form>
      <div class="spacer"></div>

    <div class="split ${sel ? 'has-sel' : ''}">
      <div class="alist">${list.length ? list.map(inboxItem).join('') : `<div class="empty">Nothing to clarify${f === 'open' ? '' : ' here'}.<br>Capture open questions and unclear ideas above. Once they're clear, turn them into a task.</div>`}</div>
      <div class="adetail">${sel ? inboxDetail(sel) : `<div class="empty">Select an item</div>`}</div>
    </div>`;

  $('#capture').onsubmit = async (e) => {
    e.preventDefault();

}

function bindInboxDetail(i) {

function selectInbox(id) {
  state.isel = id;
  history.replaceState(null, '', location.pathname + location.search + (id ? '#' + id : ''));

// ------------------------------------------------------------ tasks
function visibleTasks() {
  return state.data.tasks
    .filter(t => matches(t, ['id', 'title', 'origin', 'description']) || t.tags.some(x => x.includes(state.q))
      || t.subtasks.some(x => x.text.toLowerCase().includes(state.q)))
    .sort((a, b) => (a.order || 0) - (b.order || 0));
}

function renderTasks() {
  const { STATUSES } = state.data.meta;
  const tasks = visibleTasks();
  const cols = STATUSES.filter(s => state.showDone || s !== 'done');
  $('#main').innerHTML = `
    <div class="toolbar">
      <div class="seg" id="view">
        <button data-v="board" class="${state.view === 'board' ? 'on' : ''}">▦ Board</button>
        <button data-v="list" class="${state.view === 'list' ? 'on' : ''}">☰ List</button>
      </div>
      <label class="muted" style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="show-done" ${state.showDone ? 'checked' : ''}> Show done</label>
      <div class="spacer"></div>
      <span class="muted" style="font-size:12px">From Claude: <code>/task</code></span>
      <button class="btn primary" id="new-task">＋ Task</button>
    </div>
    ${nextUp()}
    ${state.view === 'board' ? `<div class="board">${cols.map(s => column(s, tasks.filter(t => t.status === s))).join('')}</div>`
      : `<div class="tlist">${cols.map(s => listGroup(s, tasks.filter(t => t.status === s))).join('')}</div>`}`;

  $('#view').onclick = (e) => { const b = e.target.closest('button'); if (b) { state.view = b.dataset.v; ls.set('view', b.dataset.v); render(); } };
  $('#show-done').onchange = (e) => { state.showDone = e.target.checked; ls.set('showDone', state.showDone); render(); };
  $('#new-task').onclick = () => quickAdd('todo');
  document.querySelectorAll('[data-open]').forEach(el => el.onclick = (e) => { if (!e.target.closest('select')) openTask(el.dataset.open); });
  document.querySelectorAll('.quick').forEach(el => el.onclick = () => quickAdd(el.dataset.status));
  document.querySelectorAll('.trow select').forEach(el => el.onchange = () => op('task.update', { id: el.dataset.id, patch: { [el.dataset.k]: el.value } }));
  if (state.view === 'board') bindDnD();
}

// "Next up" reminder. The selection comes from the server (nextTasks() in keepr.mjs), same as keepr next.
function nextUp() {
  const { next, tasks, meta } = state.data;
  if (!next) return '';
  const groups = Object.entries(meta.NEXT_GROUPS)
    .map(([k, label]) => [k, label, next[k].map(id => tasks.find(t => t.id === id)).filter(Boolean)])
    .filter(([, , list]) => list.length);
  if (!groups.length) return '';
  return `<div class="card nextup"><h3>Next up</h3>${groups.map(([k, label, list]) => `<div>
    <div class="ng-head ${k === 'overdue' ? 'overdue' : ''}">${label} <span class="muted" style="font-weight:500">${list.length}</span></div>

  </div>`).join('')}</div>`;
}

function column(s, tasks) {
  return `<div class="col" data-col="${s}" data-s="${s}">
    <div class="col-head"><span class="sdot"></span>${LABEL[s]} <span class="n">${tasks.length}</span></div>

function taskCard(t) {
  const done = t.subtasks.filter(s => s.done).length;
  const blocked = blockers(t);
  const links = taskLinks(t).length;
  return `<div class="tcard" draggable="true" data-open="${t.id}" data-id="${t.id}">
    <div class="t">${esc(t.title)}</div>
    ${t.subtasks.length ? `<div class="progress"><i style="width:${(done / t.subtasks.length) * 100}%"></i></div>` : ''}
    <div class="meta"><span class="id">${t.id}</span>
      ${PRIO_MARK[t.priority] ? `<span class="prio ${t.priority}">${PRIO_MARK[t.priority]}</span>` : ''}
      ${fmtDue(t.due)}
      ${t.subtasks.length ? `<span>☑ ${done}/${t.subtasks.length}</span>` : ''}
      ${t.comments.length ? `<span>💬 ${t.comments.length}</span>` : ''}
      ${blocked.length ? `<span class="chip blocked" title="Waiting for ${blocked.map(x => x.id).join(', ')}">⛔ ${blocked.map(x => x.id).join(', ')}</span>` : links ? `<span title="Links">🔗 ${links}</span>` : ''}
      ${t.pomodoros ? `<span title="${t.focusMinutes || 0} min focus">🍅 ${t.pomodoros}</span>` : ''}
      ${t.answerId ? `<span class="chip">↩ ${t.answerId}</span>` : ''}

function listGroup(s, tasks) {

  const sel = (t, k, vals) => `<select data-id="${t.id}" data-k="${k}">${vals.map(v => `<option value="${v}" ${t[k] === v ? 'selected' : ''}>${LABEL[v]}</option>`).join('')}</select>`;
  return `<div class="group" data-s="${s}">
    <div class="group-head"><span class="sdot"></span>${LABEL[s]} <span class="muted">${tasks.length}</span></div>
    ${tasks.length ? `<div class="thead"><span>ID</span><span>Task</span><span>Status</span><span>Priority</span><span>Due</span><span>Subt.</span></div>` : ''}
    <div>${tasks.map(t => `<div class="trow" data-open="${t.id}">
      <span class="id">${t.id}</span>
      <span class="t">${esc(t.title)} ${blockers(t).length ? '<span class="chip blocked">⛔</span>' : ''} ${t.tags.map(x => `<span class="chip tag">${esc(x)}</span>`).join(' ')}</span>
      ${sel(t, 'status', STATUSES)}${sel(t, 'priority', PRIORITIES)}

function bindDnD() {
  let dragId = null;
  document.querySelectorAll('.tcard').forEach(c => {
    c.ondragstart = (e) => { dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; };
    c.ondragend = () => c.classList.remove('dragging');
  });
  document.querySelectorAll('.col').forEach(col => {
    const body = $('.col-body', col);
    col.ondragover = (e) => {
      e.preventDefault(); col.classList.add('over');
      const dragging = $('.tcard.dragging'); if (!dragging) return;
      const after = [...body.querySelectorAll('.tcard:not(.dragging)')].find(el => e.clientY < el.getBoundingClientRect().top + el.offsetHeight / 2);
      body.insertBefore(dragging, after || $('.quick', body));
    };
    col.ondragleave = (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); };
    col.ondrop = (e) => {
      e.preventDefault(); col.classList.remove('over');
      if (!dragId) return;
      const orderedIds = [...body.querySelectorAll('.tcard')].map(el => el.dataset.id);
      op('task.move', { id: dragId, status: col.dataset.col, orderedIds });
      dragId = null;
    };
  });
}

async function quickAdd(status) {

// ------------------------------------------------------------ day plan
// Click or drag over the time grid to select a time window; it becomes an own entry, a linked task, or
// a free window that the AI (prompt button, MCP add_plan_blocks) or auto-fill fills later.
const SLOT = 30, SLOT_PX = 26, PX = SLOT_PX / SLOT;
const tmin = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const tstr = (n) => `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
const isFree = (b) => !b.title && !b.taskId;
const shiftDate = (date, days) => { const d = new Date(date + 'T00:00'); d.setDate(d.getDate() + days); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dur = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')} h`;

function dayBlocks(date = state.day) {
  return (state.data.plan || []).filter(b => b.date === date).sort((a, b) => a.start.localeCompare(b.start));
}
function dayRange(blocks) {
  const [from, to] = ls.get('dayRange', [7, 21]);
  let a = from * 60, z = to * 60;
  for (const b of blocks) { a = Math.min(a, Math.floor(tmin(b.start) / 60) * 60); z = Math.max(z, Math.ceil(tmin(b.end) / 60) * 60); }
  if (state.ddraft) { a = Math.min(a, tmin(state.ddraft.start)); z = Math.max(z, tmin(state.ddraft.end)); }
  return [a, Math.min(z, 24 * 60)];
}
// Free minutes after `start` until the next non-free block (for drops and new blocks).
function roomAfter(start, blocks, want = 60) {
  const next = blocks.filter(b => !isFree(b) && tmin(b.start) >= start).map(b => tmin(b.start));
  return Math.min(start + want, ...next, 24 * 60);
}

function renderDay() {
  state.day ||= today();
  const d = state.data, blocks = dayBlocks();
  const [a, z] = dayRange(blocks);
  const sum = (f) => blocks.filter(f).reduce((n, b) => n + tmin(b.end) - tmin(b.start), 0);
  const plannedIds = new Set(blocks.map(b => b.taskId).filter(Boolean));
  const nextIds = Object.values(d.next || {}).flat();
  const open = d.tasks.filter(t => t.status !== 'done' && matches(t, ['id', 'title', 'description']))
    .sort((x, y) => (nextIds.includes(x.id) ? nextIds.indexOf(x.id) : 999) - (nextIds.includes(y.id) ? nextIds.indexOf(y.id) : 999)
      || d.meta.PRIORITIES.indexOf(x.priority) - d.meta.PRIORITIES.indexOf(y.priority) || (x.order || 0) - (y.order || 0));
  const label = new Date(state.day + 'T00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  const slots = [];
  const dr = state.ddraft && [tmin(state.ddraft.start), tmin(state.ddraft.end)];
  for (let m = a; m < z; m += SLOT) slots.push(`<div class="dslot ${m % 60 ? '' : 'hour'} ${dr && m + SLOT > dr[0] && m < dr[1] ? 'pick' : ''}" data-m="${m}"><span class="h">${m % 60 ? '' : tstr(m)}</span><span class="c"></span></div>`);
  const nowM = new Date().getHours() * 60 + new Date().getMinutes();
  const nowLine = state.day === today() && nowM >= a && nowM < z ? `<div class="now-line" style="top:${(nowM - a) * PX}px"></div>` : '';

  $('#main').innerHTML = `
    <div class="toolbar">
      <div class="seg" id="dnav"><button data-d="-1" title="Previous day">‹</button><button data-d="0" class="${state.day === today() ? 'on' : ''}">Today</button><button data-d="1" title="Next day">›</button></div>
      <input class="input" type="date" id="dpick" value="${state.day}">
      <b>${label}</b>
      <div class="spacer"></div>
      <span class="muted" style="font-size:12px">Click or drag in the grid · drag tasks onto it</span>
    </div>
    <div class="day">
      <div class="dgrid" id="dgrid" style="height:${(z - a) * PX}px">${slots.join('')}
        ${blocks.map(b => dayBlock(b, a)).join('')}${nowLine}</div>
      <div class="dside">
        ${dayEditor(blocks, open)}
        <div class="card">
          <h3>Let the AI plan</h3>
          <div class="dsum"><span>Planned <b>${dur(sum(b => !isFree(b)))}</b></span><span>Free windows <b>${dur(sum(isFree))}</b></span><span>Done <b>${blocks.filter(b => b.done).length}/${blocks.filter(b => !isFree(b)).length}</b></span></div>
          <p class="hint">Mark free windows in the grid, then hand them to your AI. It fills them via the keepr MCP tools or the CLI (<code>keepr plan</code>) – the grid updates live.</p>
          <div class="row" style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
            <button class="btn primary" id="d-prompt" title="Copies a prompt for Claude, ChatGPT/Codex or any other agent">⧉ Prompt for AI</button>
            <button class="btn" id="d-auto" title="Fills free windows with open tasks: overdue, due soon, urgent first (max. 90 min each, no AI)">Auto-fill</button>
          </div>
        </div>
        <div class="card">
          <h3>Tasks <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">drag into the plan</span></h3>
          <div class="dtasks">${open.map(t => `<div class="dtask ${plannedIds.has(t.id) ? 'planned' : ''}" draggable="true" data-dtask="${t.id}" data-s="${t.status}">
            <span class="sdot" title="${LABEL[t.status]}"></span><span class="id">${t.id}</span><span class="t" title="${esc(t.title)}">${esc(t.title)}</span>
            <span class="meta">${plannedIds.has(t.id) ? '<span title="Already planned this day">✓</span>' : ''}${PRIO_MARK[t.priority] ? `<span class="prio ${t.priority}">${PRIO_MARK[t.priority].split(' ')[0]}</span>` : ''}${fmtDue(t.due)}</span></div>`).join('') || '<p class="hint">No open tasks.</p>'}</div>
        </div>
      </div>
    </div>`;
  bindDay(blocks, a);
}

function dayBlock(b, a) {
  const t = b.taskId && state.data.tasks.find(x => x.id === b.taskId);
  const kind = isFree(b) ? 'free' : t ? 'task' : 'own';
  const h = (tmin(b.end) - tmin(b.start)) * PX;
  const title = isFree(b) ? 'Free window – for the AI' : esc(b.title || t?.title || b.taskId);
  const sub = t ? ` <small>${t.id}${b.title && b.title !== t.title ? ` · ${esc(t.title)}` : ''}</small>` : '';
  return `<div class="dblock ${kind} ${b.done ? 'done' : ''} ${b.id === state.dsel ? 'sel' : ''}" data-b="${b.id}"
      style="top:${(tmin(b.start) - a) * PX + 1}px;height:${Math.max(h - 2, 14)}px" title="${b.start}–${b.end}${b.note ? ' · ' + esc(b.note) : ''}${b.by === 'ai' ? ' · planned by AI' : b.by === 'auto' ? ' · auto-filled' : ''}">
    ${isFree(b) ? '' : `<input type="checkbox" data-bdone="${b.id}" ${b.done ? 'checked' : ''} title="Done">`}
    <span class="t">${title}${sub}${h > 40 && b.note ? `<br><small>${esc(b.note)}</small>` : ''}</span>
    <span class="tm">${b.start}–${b.end}${b.by === 'ai' ? ' ✦' : ''}</span></div>`;
}

function dayEditor(blocks, open) {
  const b = state.dsel && blocks.find(x => x.id === state.dsel);
  const dr = state.ddraft;
  if (!b && !dr) return `<div class="card"><h3>Time block</h3><p class="hint">Click a slot or drag across several to select a time window. Then give it a title, link a keepr task, or leave it as a free window for the AI.</p></div>`;
  const cur = b || { start: dr.start, end: dr.end, title: '', taskId: '', note: '' };
  const tasks = [...open];
  if (cur.taskId && !tasks.some(t => t.id === cur.taskId)) { const t = state.data.tasks.find(x => x.id === cur.taskId); if (t) tasks.unshift(t); }
  return `<div class="card deditor">
    <h3>${b ? `${b.id} · ${isFree(b) ? 'free window' : 'block'}` : 'New block'}<span class="spacer"></span><button class="btn ghost sm" id="de-close">✕</button></h3>
    <div class="row"><input class="input" type="time" step="300" id="de-start" value="${cur.start}"> – <input class="input" type="time" step="300" id="de-end" value="${cur.end}"></div>
    <input class="input" id="de-title" placeholder="Own entry, e.g. Lunch, Emails, Gym" value="${esc(cur.title)}">
    <select class="input" id="de-task"><option value="">— no keepr task —</option>${tasks.map(t => `<option value="${t.id}" ${t.id === cur.taskId ? 'selected' : ''}>${t.id} – ${esc(t.title)}</option>`).join('')}</select>
    <textarea class="input" id="de-note" placeholder="Note (optional)">${esc(cur.note)}</textarea>
    <div class="row">
      <button class="btn primary" id="de-save">${b ? 'Save' : 'Add'}</button>
      <button class="btn" id="de-free" title="Keep it empty so the AI or auto-fill puts tasks in">Free window for AI</button>
      ${b?.taskId ? `<button class="btn ghost" id="de-open">Open ${b.taskId}</button>` : ''}
      ${b ? `<button class="btn ghost danger" id="de-del">Delete</button>` : ''}
    </div></div>`;
}

function bindDay(blocks, a) {
  const grid = $('#dgrid');
  $('#dnav').onclick = (e) => { const btn = e.target.closest('button'); if (!btn) return; const n = Number(btn.dataset.d); state.day = n ? shiftDate(state.day, n) : today(); state.dsel = state.ddraft = null; render(); };
  $('#dpick').onchange = (e) => { if (e.target.value) { state.day = e.target.value; state.dsel = state.ddraft = null; render(); } };

  // Select a time window by clicking or dragging over the slots.
  const slotAt = (y) => { const r = grid.getBoundingClientRect(); return a + Math.max(0, Math.floor((y - r.top) / SLOT_PX)) * SLOT; };
  let anchor = null;
  const paint = (s, e) => grid.querySelectorAll('.dslot').forEach(el => { const m = Number(el.dataset.m); el.classList.toggle('pick', m >= s && m < e); });
  grid.onmousedown = (e) => {
    if (e.button !== 0 || !e.target.closest('.dslot .c')) return;
    anchor = slotAt(e.clientY); paint(anchor, anchor + SLOT); e.preventDefault();
  };
  grid.onmousemove = (e) => { if (anchor === null) return; const m = slotAt(e.clientY); paint(Math.min(anchor, m), Math.max(anchor, m) + SLOT); };
  const finish = (e) => {
    if (anchor === null) return;
    const m = slotAt(e.clientY), s = Math.min(anchor, m), end = Math.max(anchor, m) + SLOT;
    anchor = null;
    state.dsel = null;
    state.ddraft = { start: tstr(s), end: tstr(s === end - SLOT ? roomAfter(s, blocks, 60) : end) };
    render(); $('#de-title')?.focus();
  };
  grid.onmouseup = finish;
  document.onmouseup = (e) => { if (anchor !== null && !grid.contains(e.target)) finish(e); };

  grid.querySelectorAll('[data-b]').forEach(el => el.onclick = (e) => {
    if (e.target.matches('input')) return;
    state.dsel = el.dataset.b; state.ddraft = null; render();
  });
  grid.querySelectorAll('[data-bdone]').forEach(el => el.onchange = () => op('plan.update', { id: el.dataset.bdone, patch: { done: el.checked } }));

  // Drag a task onto a slot or into a free window.
  document.querySelectorAll('[data-dtask]').forEach(el => {
    el.ondragstart = (e) => { e.dataTransfer.setData('text/keepr-task', el.dataset.dtask); e.dataTransfer.effectAllowed = 'copy'; };
    el.onclick = () => openTask(el.dataset.dtask);
  });
  const clearDrop = () => grid.querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
  grid.ondragover = (e) => {
    if (!e.dataTransfer.types.includes('text/keepr-task')) return;
    e.preventDefault(); clearDrop();
    const fb = e.target.closest('.dblock.free');
    if (fb) fb.classList.add('drop'); else grid.querySelector(`.dslot[data-m="${slotAt(e.clientY)}"]`)?.classList.add('drop');
  };
  grid.ondragleave = (e) => { if (!grid.contains(e.relatedTarget)) clearDrop(); };
  grid.ondrop = (e) => {
    const id = e.dataTransfer.getData('text/keepr-task');
    clearDrop();
    if (!id) return;
    e.preventDefault();
    const fb = e.target.closest('.dblock.free');
    const free = fb && blocks.find(b => b.id === fb.dataset.b);
    const start = free ? tmin(free.start) : slotAt(e.clientY);
    const end = free ? Math.min(tmin(free.end), start + 60) : roomAfter(start, blocks, 60);
    op('plan.add', { date: state.day, start: tstr(start), end: tstr(end), taskId: id }).catch(() => {});
  };

  $('#d-prompt').onclick = () => copy(dayPrompt(blocks), 'Prompt copied – paste it into your AI chat');
  $('#d-auto').onclick = async () => {
    if (!blocks.some(isFree)) return toast('Mark a free window first');
    const added = await op('plan.autofill', { date: state.day });
    toast(added.length ? `${added.length} block(s) filled` : 'Nothing to fill');
  };

  if (!$('.deditor')) return;
  const b = state.dsel && blocks.find(x => x.id === state.dsel);
  const close = () => { state.dsel = state.ddraft = null; render(); };
  const vals = (free) => ({
    start: $('#de-start').value, end: $('#de-end').value,
    title: free ? '' : $('#de-title').value.trim(), taskId: free ? null : $('#de-task').value || null, note: $('#de-note').value,
  });
  const save = async (free) => {
    const v = vals(free);
    if (b) await op('plan.update', { id: b.id, patch: v });
    else await op('plan.add', { date: state.day, ...v });
    close();
  };
  $('#de-close').onclick = close;
  $('#de-save').onclick = () => save(false).catch(() => {});
  $('#de-free').onclick = () => save(true).catch(() => {});
  $('.deditor').onkeydown = (e) => { if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); save(false).catch(() => {}); } };
  if ($('#de-open')) $('#de-open').onclick = () => openTask(b.taskId);
  if ($('#de-del')) $('#de-del').onclick = async () => { await op('plan.delete', { id: b.id }); close(); };
}

// Provider-neutral prompt: works with any agent that has the keepr MCP server or can run the CLI.
function dayPrompt(blocks) {
  const name = state.projects.find(p => p.path === state.project)?.name || state.project;
  const free = blocks.filter(isFree).map(b => `${b.start}–${b.end}`);
  const fixed = blocks.filter(b => !isFree(b)).map(b => `${b.start}–${b.end} ${b.taskId ? `${b.taskId} (${state.data.tasks.find(t => t.id === b.taskId)?.title || ''})` : b.title}`);
  return [
    `Plan my day ${state.day} in the keepr project "${name}".`,
    free.length ? `Free windows to fill: ${free.join(', ')}.` : 'No free windows are marked yet – suggest a plan for the usual working hours around the fixed blocks.',
    fixed.length ? `Already fixed: ${fixed.join('; ')}.` : '',
    'Choose suitable open keepr tasks (overdue, due soon, urgent/high first), realistic block lengths, short breaks and some buffer; add own blocks where useful. Briefly explain your choice.',
    `Use the keepr MCP tools get_day_plan and add_plan_blocks (project "${name}", date ${state.day}). Without MCP: keepr plan show ${state.day}, then keepr plan add HH:MM-HH:MM --task T3 --date ${state.day} (or a title instead of --task).`,
  ].filter(Boolean).join('\n');
}

// ------------------------------------------------------------ task drawer
function openTask(id) { state.task = id; render(); $('#drawer').classList.add('open'); $('#drawer-bg').classList.add('open'); }
function closeTask() { state.task = null; $('#drawer').classList.remove('open'); $('#drawer-bg').classList.remove('open'); }

function renderDrawer(force = false) {
  const t = state.data.tasks.find(x => x.id === state.task);
  if (!t) return closeTask();
  const { STATUSES, PRIORITIES, LINK_TYPES } = state.data.meta;
  const ans = t.answerId && state.data.answers.find(a => a.id === t.answerId);
  const inb = t.inboxId && state.data.inbox.find(i => i.id === t.inboxId);
  const ae = document.activeElement;
  const typing = $('#drawer').contains(ae) && (ae.matches('textarea') || ['t-title', 't-tags', 'sub-text', 'l-to'].includes(ae.id));
  if (typing && !force) return; // don't overwrite while typing
  const keep = typing && ae.id ? { id: ae.id, value: ae.value, start: ae.selectionStart, end: ae.selectionEnd } : null;
  const done = t.subtasks.filter(s => s.done).length;
  const links = taskLinks(t);
  const others = state.data.tasks.filter(x => x.id !== t.id && !links.some(l => l.id === x.id));
  const pomoHere = P.s.task?.id === t.id && P.s.task?.project === state.project;
  const statusOpts = (cur) => STATUSES.map(s => `<option value="${s}" ${s === cur ? 'selected' : ''}>${LABEL[s]}</option>`).join('');
  $('#drawer').innerHTML = `
    <div style="display:flex;gap:8px;align-items:center"><span class="id">${t.id}</span><div class="spacer"></div>
      <button class="btn ghost sm" id="t-pomo" title="Start a pomodoro (focus session) on this task">🍅 ${pomoHere && P.s.running ? 'Running' : 'Focus'}</button>
      <button class="btn ghost sm" id="t-copy" title="For the chat with the AI">⧉ For Claude</button>
      <button class="btn ghost sm danger" id="t-del">Delete</button><button class="btn ghost" id="t-close">✕</button></div>
    <input class="title-edit" id="t-title" value="${esc(t.title)}" style="width:100%">
    <div class="props">

// ------------------------------------------------------------ pomodoro
// State lives in localStorage so it survives reloads and is shared between dashboard tabs.
const P = { s: null, ctx: null };
function pomoLoad() {
  const cfg = { focus: 25, short: 5, long: 15, every: 4 };
  const s = ls.get('pomo', {});
  P.s = { mode: 'focus', running: false, endAt: null, left: null, round: 0, task: null, ...s, cfg: { ...cfg, ...(s.cfg || {}) } };
}
const pomoSave = () => ls.set('pomo', P.s);
const pomoDur = (mode) => P.s.cfg[mode] * 60000;
const pomoLeft = () => P.s.running ? Math.max(0, P.s.endAt - Date.now()) : (P.s.left ?? pomoDur(P.s.mode));
const mmss = (ms) => { const t = Math.ceil(ms / 1000); return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
// Simple line icons (round caps and joins, current text colour) for the pomodoro controls.
const ICON = {
  // counter-clockwise arrow: the circle runs from the top-left round to the left, the head points along it
  reset: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>',
  skip: '<svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5.2c0-.8.9-1.3 1.6-.8l6.3 4.8c.5.4.5 1.2 0 1.6l-6.3 4.8c-.7.5-1.6 0-1.6-.8z"/><path d="M15.5 5v10"/></svg>',
};
const POMO_MODES = { focus: 'Focus', short: 'Short break', long: 'Long break' };

function pomoStart(task) {
  if (task) {
    if (P.s.mode !== 'focus' || P.s.task?.id !== task.id || P.s.task?.project !== task.project) {
      P.s.running = false; P.s.left = null; P.s.mode = 'focus';
    }
    P.s.task = task;
  }
  if (!P.s.running) {
    P.s.endAt = Date.now() + pomoLeft(); P.s.running = true; P.s.left = null;
  }
  try { P.ctx ??= new AudioContext(); } catch {}
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  pomoSave(); pomoPaint(true);
}
function pomoPause() { P.s.left = pomoLeft(); P.s.running = false; P.s.endAt = null; pomoSave(); pomoPaint(true); }
function pomoReset() { P.s.running = false; P.s.endAt = null; P.s.left = null; pomoSave(); pomoPaint(true); }
function pomoMode(mode) { P.s.mode = mode; pomoReset(); }

function pomoComplete(skipped = false) {
  const fresh = ls.get('pomo', {});
  if (!skipped && (!fresh.running || fresh.endAt !== P.s.endAt)) { pomoLoad(); return; } // another tab handled it
  const finished = P.s.mode;
  // Phase ran out while the idle view is up: freeze it as a still image until the user is back.
  pomoDone = !skipped && pomoBigOn ? { mode: finished, task: P.s.task, round: P.s.round } : null;
  if (finished === 'focus' && !skipped) {
    P.s.round++;
    if (P.s.task) opIn(P.s.task.project, 'task.pomodoro', { id: P.s.task.id, minutes: P.s.cfg.focus }).catch(() => {});
  }
  P.s.mode = finished === 'focus' ? (P.s.round && P.s.round % P.s.cfg.every === 0 ? 'long' : 'short') : 'focus';
  P.s.running = false; P.s.endAt = null; P.s.left = null;
  pomoSave(); pomoPaint(true);
  if (!skipped) pomoNotify(finished === 'focus' ? `Focus done${P.s.task ? ` (${P.s.task.id})` : ''} – time for a ${P.s.mode === 'long' ? 'long ' : ''}break` : 'Break over – back to focus');
}

function pomoNotify(msg) {
  toast(msg);
  try {
    const ctx = P.ctx; if (!ctx) throw 0;
    [0, 0.25, 0.5].forEach(d => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(0.15, ctx.currentTime + d); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d + 0.2);
      o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.2);
    });
  } catch {}
  try { if (Notification.permission === 'granted') new Notification('keepr 🍅', { body: msg }); } catch {}
}

// Was the click inside one of these elements? Uses the path at click time, because a click often
// re-renders the popover and detaches its target before this check runs.
const clickedIn = (e, sel) => e.composedPath().some(n => n instanceof Element && n.matches(sel));
// The pomodoro popover closes shortly after the pointer leaves it (not while a field in it is in use).
let pomoLeaveTimer = null;
function pomoHoverInit() {
  const pop = $('#pomo-pop');
  pop.addEventListener('mouseenter', () => clearTimeout(pomoLeaveTimer));
  pop.addEventListener('mouseleave', (e) => {
    if (e.relatedTarget && e.relatedTarget.closest?.('#pomo-btn')) return; // back onto its button
    clearTimeout(pomoLeaveTimer);
    pomoLeaveTimer = setTimeout(() => {
      if (pop.hidden || pop.matches(':hover') || pop.contains(document.activeElement) && document.activeElement.matches('input, select')) return;

}
function pomoOpen(open = $('#pomo-pop').hidden) { if (open) settingsOpen(false); $('#pomo-pop').hidden = !open; pomoPaint(true); popSync(); }

function pomoPaint(full = false) {
  if (!P.s) return;

  const btn = $('#pomo-btn');
  btn.textContent = `${P.s.mode === 'focus' ? '🍅' : '☕'} ${left}`;

    const done = D ? 100 : Math.min(100, 100 - pomoLeft() / pomoDur(mode) * 100);
    const ring = settings().idleSeconds !== 'digits';
    // Ring mode: only the minutes, inside a thin circle that drains smoothly over each minute
    // (driven by pomoRingTick), instead of digits that jump every second.
    const mins = D ? 0 : Math.ceil(pomoLeft() / 60000);
    const time = ring ? `<div class="pb-time pb-ringed"><svg class="pb-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="47"/><circle class="fg" id="pb-ring-fg" cx="50" cy="50" r="47" pathLength="1"/></svg><span class="pb-min">${mins}</span><small>min</small></div>`

    big.innerHTML = `<div class="pb-mode">${D ? (mode === 'focus' ? 'Focus done' : 'Break over') : esc(POMO_MODES[mode])}</div>

  if (pop.contains(document.activeElement) && document.activeElement.matches('input, select')) return;
  const tasks = state.data ? state.data.tasks.filter(t => t.status !== 'done') : [];
  const cur = P.s.task;

  pop.innerHTML = `
    <div class="seg" id="pomo-modes">${Object.entries(POMO_MODES).map(([k, l]) => `<button data-m="${k}" class="${P.s.mode === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="pp-clock">

      <button class="btn" id="pomo-reset">${ICON.reset} Reset</button>
      <button class="btn" id="pomo-skip" title="Skip to the next phase">${ICON.skip} Skip</button>
    </div>

        `<label><span>${l}</span><span class="pc-in"><input class="input" type="number" min="1" max="${k === 'every' ? 12 : 180}" data-cfg="${k}" value="${P.s.cfg[k]}"><small>${u}</small></span></label>`).join('')}</div>

// Idle focus view: while the timer runs and nothing happens on the page for a while,
// it grows from the header button into the centre; any activity sends it back.
let pomoLastActive = Date.now(), pomoBigOn = false;
let pomoDone = null; // snapshot of a phase that just finished while the idle view was showing

// Plant: vines grow in from the screen edges while the focus phase runs; the closer the end,
// the more of the border they cover. Generated per phase (seeded), drawn as SVG, revealed by progress.
const plant = { key: null, stems: [], leaves: [] };

function plantBuild(seed) {

  const svg = $('#pomo-plant'), NS = 'http://www.w3.org/2000/svg';
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  // Layers: cracks in the screen below, the plant above (with a drop shadow for depth, see plantUpdate).
  svg.innerHTML = `<defs><filter id="vine-depth" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000" flood-opacity=".38"/></filter></defs>
    <g id="plant-cracks"></g><g id="plant-g"></g>`;
  const cracksG = svg.querySelector('#plant-cracks'), plantG = svg.querySelector('#plant-g');
  plant.stems = []; plant.leaves = []; plant.cracks = [];
  // Number of vines and how much they branch, from the settings menu. With "vary per phase" on,
  // each phase picks its own values in a window around the setting (±spread), seeded per phase.
  // Amount, branching and evenness each have a mode (settings menu): "fixed" uses the slider value,
  // "vary" picks a value within ±spread around it, "random" picks anything in the slider's range.
  // All picks are seeded per phase, so a phase keeps its look.
  const SV = settings();
  const pick = (mode, val, lo, hi, additive, spread) => {
    const sp = spread / 100;

    return Math.min(hi, Math.max(lo, v));

  const branch = pick(SV.pomoBranchMode, SV.pomoBranch / 100, 0, 2, false, SV.pomoBranchSpread);
  // Evenness: 0 = start points scattered anywhere along the edges, 1 = evenly spaced (little jitter).
  const even = pick(SV.pomoEvenMode, SV.pomoEven / 100, 0, 1, true, SV.pomoEvenSpread);
  plant.amount = amount; plant.branch = branch; plant.even = even;
  // Greens relative to the theme's base lightness (--plant-l); one blossom colour per phase.
  const green = (h, s, l) => `hsl(${h.toFixed(0)} ${Math.min(70, s).toFixed(0)}% calc(var(--plant-l) + ${l.toFixed(1)}%))`;
  const BLOOMS = [['#f3b3c4', '#f2cf6b'], ['#f4a38c', '#f7e1a0'], ['#c9b6ee', '#f2d675'], ['#f6efe0', '#e8b64c'],
    ['#f7c59f', '#c97b4a'], ['#e3a6d6', '#f5e08a'], ['#a9cdf0', '#f6efe0'], ['#f28f8f', '#f6d98b']];

    const [r, g, b] = [1, 3, 5].map(i => parseInt(bloom.slice(i, i + 2), 16) / 255);

  closeTask();
  if (id[0] === 'A') { state.tab = 'answers'; selectAnswer(id); }
  else { state.tab = 'inbox'; if (state.iFilter !== 'all' && state.data.inbox.find(i => i.id === id)?.status !== state.iFilter) state.iFilter = 'all'; selectInbox(id); }
}
